<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Web Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MÀN HÌNH CHÍNH -->
    <div class="desktop">
        
        <!-- Các Icon trên Desktop -->
        <div class="desktop-icons">
            <div class="icon" onclick="openWindow('this-pc')">
                <img src="https://win11.blueedge.me/img/icon/win/computer.png" alt="This PC">
                <span>This PC</span>
            </div>
            <div class="icon" onclick="openWindow('notepad')">
                <img src="https://win11.blueedge.me/img/icon/win/notepad.png" alt="Notepad">
                <span>Notepad</span>
            </div>
            <div class="icon" onclick="openWindow('recycle')">
                <img src="https://win11.blueedge.me/img/icon/win/trash.png" alt="Recycle Bin">
                <span>Recycle Bin</span>
            </div>
        </div>

        <!-- CỬA SỔ 1: THIS PC -->
        <div id="win-this-pc" class="window">
            <div class="window-header">
                <div class="title">📁 This PC</div>
                <div class="controls">
                    <span class="min">—</span>
                    <span class="max">🗖</span>
                    <span class="close" onclick="closeWindow('this-pc')">✕</span>
                </div>
            </div>
            <div class="window-content">
                <div class="folder-grid">
                    <div class="folder-item">📁 Desktop</div>
                    <div class="folder-item">📁 Downloads</div>
                    <div class="folder-item">📁 Documents</div>
                    <div class="folder-item">💽 Local Disk (C:)</div>
                </div>
            </div>
        </div>

        <!-- CỬA SỔ 2: NOTEPAD -->
        <div id="win-notepad" class="window">
            <div class="window-header">
                <div class="title">📝 Notepad</div>
                <div class="controls">
                    <span class="min">—</span>
                    <span class="max">🗖</span>
                    <span class="close" onclick="closeWindow('notepad')">✕</span>
                </div>
            </div>
            <div class="window-content">
                <textarea placeholder="Nhập văn bản vào đây..."></textarea>
            </div>
        </div>

        <!-- CỬA SỔ 3: RECYCLE BIN -->
        <div id="win-recycle" class="window">
            <div class="window-header">
                <div class="title">🗑️ Recycle Bin</div>
                <div class="controls">
                    <span class="min">—</span>
                    <span class="max">🗖</span>
                    <span class="close" onclick="closeWindow('recycle')">✕</span>
                </div>
            </div>
            <div class="window-content" style="padding: 20px; color: #555;">
                Thư mục trống.
            </div>
        </div>

    </div>

    <!-- THANH TASKBAR -->
    <div class="taskbar">
        <div class="taskbar-left">
            <img src="https://win11.blueedge.me/img/icon/win/home.png" class="start-btn" onclick="toggleStartMenu()">
            <img src="https://win11.blueedge.me/img/icon/win/search.png" class="task-icon">
            <img src="https://win11.blueedge.me/img/icon/win/explorer.png" class="task-icon" onclick="openWindow('this-pc')">
        </div>
        
        <!-- Đồng hồ góc phải -->
        <div class="taskbar-right" id="clock">
            00:00 AM
        </div>
    </div>

    <!-- MENU START (Mặc định ẩn) -->
    <div id="start-menu" class="start-menu">
        <input type="text" placeholder="Type here to search..." class="start-search">
        <div class="start-apps">
            <div class="start-app-item" onclick="openWindow('notepad'); toggleStartMenu()"><img src="https://win11.blueedge.me/img/icon/win/notepad.png"> Notepad</div>
            <div class="start-app-item" onclick="openWindow('this-pc'); toggleStartMenu()"><img src="https://win11.blueedge.me/img/icon/win/explorer.png"> Explorer</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
