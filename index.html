<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 12 Web Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="desktop">
        
        <div class="desktop-icons">
            <div class="icon-item" onclick="openWindow('this-pc')">
                <i class="fa-solid fa-desktop icon-display" style="color: #3b82f6;"></i>
                <span>This PC</span>
            </div>
            <div class="icon-item" onclick="openWindow('notepad')">
                <i class="fa-solid fa-file-lines icon-display" style="color: #f59e0b;"></i>
                <span>Notepad</span>
            </div>
            <div class="icon-item" onclick="openWindow('edge')">
                <i class="fa-brands fa-edge icon-display" style="color: #10b981;"></i>
                <span>Edge Browser</span>
            </div>
        </div>

        <div id="win-this-pc" class="window-os">
            <div class="window-header">
                <div class="window-title"><i class="fa-solid fa-desktop"></i> This PC</div>
                <div class="window-controls">
                    <span class="ctrl-btn min">—</span>
                    <span class="ctrl-btn max">🗖</span>
                    <span class="ctrl-btn close" onclick="closeWindow('this-pc')">✕</span>
                </div>
            </div>
            <div class="window-content folder-view">
                <div class="folder-item"><i class="fa-solid fa-folder" style="color: #ecc94b;"></i> Documents</div>
                <div class="folder-item"><i class="fa-solid fa-folder" style="color: #ecc94b;"></i> Downloads</div>
                <div class="folder-item"><i class="fa-solid fa-hard-drive" style="color: #a0aec0;"></i> Local Disk (C:)</div>
            </div>
        </div>

        <div id="win-notepad" class="window-os">
            <div class="window-header">
                <div class="window-title"><i class="fa-solid fa-file-lines"></i> Notepad</div>
                <div class="window-controls">
                    <span class="ctrl-btn min">—</span>
                    <span class="ctrl-btn max">🗖</span>
                    <span class="ctrl-btn close" onclick="closeWindow('notepad')">✕</span>
                </div>
            </div>
            <div class="window-content">
                <textarea class="notepad-text" placeholder="Nhập ghi chú của bạn vào đây..."></textarea>
            </div>
        </div>

        <div id="win-edge" class="window-os" style="width: 700px; height: 450px;">
            <div class="window-header">
                <div class="window-title"><i class="fa-brands fa-edge"></i> Microsoft Edge</div>
                <div class="window-controls">
                    <span class="ctrl-btn min">—</span>
                    <span class="ctrl-btn max">🗖</span>
                    <span class="ctrl-btn close" onclick="closeWindow('edge')">✕</span>
                </div>
            </div>
            <div class="window-content" style="padding: 0;">
                <iframe src="https://www.bing.com" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>

    </div>

    <div id="start-menu" class="start-menu-panel">
        <input type="text" class="start-search" placeholder="Type here to search...">
        <div class="pinned-apps-grid">
            <div class="pinned-app" onclick="openWindow('edge'); toggleStartMenu()"><i class="fa-brands fa-edge"></i><span>Edge</span></div>
            <div class="pinned-app" onclick="openWindow('notepad'); toggleStartMenu()"><i class="fa-solid fa-file-lines"></i><span>Notepad</span></div>
            <div class="pinned-app" onclick="openWindow('this-pc'); toggleStartMenu()"><i class="fa-solid fa-desktop"></i><span>This PC</span></div>
        </div>
        <div class="start-footer">
            <div class="user-profile"><i class="fa-solid fa-circle-user"></i> Scratcher_01</div>
            <i class="fa-solid fa-power-off power-icon" onclick="alert('Đang tắt máy...')"></i>
        </div>
    </div>

    <div class="taskbar-wrapper">
        <div class="taskbar-dock">
            <div class="taskbar-icon start-trigger" onclick="toggleStartMenu()">
                <i class="fa-brands fa-microsoft"></i>
            </div>
            <div class="taskbar-icon" onclick="openWindow('this-pc')"><i class="fa-solid fa-desktop" style="color: #2b6cb0;"></i></div>
            <div class="taskbar-icon" onclick="openWindow('notepad')"><i class="fa-solid fa-file-lines" style="color: #dd6b20;"></i></div>
            <div class="taskbar-icon" onclick="openWindow('edge')"><i class="fa-brands fa-edge" style="color: #319795;"></i></div>
            
            <div class="taskbar-separator"></div>
            
            <div class="taskbar-clock" id="live-clock">12:00 PM</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
